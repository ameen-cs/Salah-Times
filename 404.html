<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Salah Times</title>
  <meta name="theme-color" content="#2A1F18">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .err-wrap { max-width: 480px; margin: 4rem auto; padding: 2rem 1.25rem; text-align: center; }
    .err-code { font-size: 4rem; font-weight: 800; color: var(--green); letter-spacing: -0.05em; }
    .err-title { font-size: 1.4rem; font-weight: 700; margin: 0.5rem 0 0.75rem; color: var(--text); }
    .err-sub { color: var(--text-faint); margin-bottom: 1.5rem; }
    .err-link { display: inline-block; background: var(--green); color: #fff; padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); text-decoration: none; font-weight: 600; }
    .err-link:hover { background: var(--green-mid); }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-code">404</div>
    <h1 class="err-title">Page not found</h1>
    <p class="err-sub">The page you're looking for doesn't exist on this site.</p>
    <a href="/" class="err-link">Back to Salah Times</a>
  </div>
</body>
</html>
