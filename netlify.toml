# Static site served from the repo root, plus the serverless CORS proxy in
# netlify/functions. The /api/proxy → function rewrite lives in _redirects.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The scheduled sync loads the site's own config/parser scripts at runtime
[functions."sync-times"]
  included_files = ["js/config.js", "js/api.js"]
