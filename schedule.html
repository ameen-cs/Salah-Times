<body>
  <header class="top">
    <div class="wrap">
      <a href="index.html" class="brand" aria-label="Salah Times home">
        <img src="/logo.png" alt="" height="32">
        <span class="brand-text"><b>Salah Times</b><small>Stanger</small></span>
      </a>
      <nav class="top-nav" aria-label="Main">
        <a href="index.html">Today</a>
        <a href="schedule.html" aria-current="page">Schedule</a>
      </nav>
      <div class="top-r">
        <span class="clock" id="live-clock">—</span>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh times" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <a href="admin.html" class="icon-btn has-label" aria-label="Admin" title="Admin">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span class="lbl">Admin</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Masjid picker (phones) -->
  <div class="picker">
    <div class="wrap"><div class="seg" id="mosque-tabs-bar" role="group" aria-label="Choose masjid"></div></div>
  </div>

  <!-- Masjid header -->
  <section class="mh" aria-live="polite">
    <div class="hero-bism" aria-hidden="true">بسم الله الرحمن الرحيم</div>
    <div class="wrap">
      <div id="mosque-header" class="mosque-header"></div>
    </div>
  </section>

  <main class="wrap page" id="main-content">
    <!-- Masjid list (desktop) -->
    <nav class="rail" id="sidebar" aria-label="Masājid">
      <p>Masājid</p>
      <ul id="mosque-list"></ul>
    </nav>

    <div class="col">
      <div>
        <div class="sec-h"><h2>Salah times</h2><span id="next-cap"></span></div>
        <ol class="tl" id="prayer-cards"></ol>
      </div>
      <div id="juma-wrap"></div>
    </div>

    <div class="col" id="mosque-links"></div>
  </main>

  <footer class="foot wrap"><p id="footer-date">All times are Jamaat times</p></footer>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</a>
    <a href="schedule.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</a>
  </nav>

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
  <script src="js/config.js"></script>
  <script src="js/db-client.js"></script>
  <script src="js/api.js"></script>
